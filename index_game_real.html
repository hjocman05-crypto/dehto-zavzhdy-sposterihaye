<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ДЕХТО ЗАВЖДИ СПОСТЕРІГАЄ — GAME</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050711;color:#fff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
body{touch-action:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#050711}
#game{position:relative;width:100vw;height:100vh;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:auto}
.hud{position:absolute;z-index:5;top:max(12px,env(safe-area-inset-top));left:14px;right:14px;display:flex;justify-content:space-between;pointer-events:none}
.box{background:rgba(4,6,13,.76);border:2px solid #69718a;padding:8px 12px;box-shadow:0 0 0 2px rgba(0,0,0,.25);font-size:clamp(11px,2vw,17px)}
#goal{max-width:45%}
#message{position:absolute;z-index:6;left:50%;bottom:8%;transform:translateX(-50%);width:min(760px,78%);text-align:center;background:rgba(3,5,10,.82);border:1px solid #69718a;padding:10px 14px;font-size:clamp(12px,2vw,17px);display:none}
#dialog{position:absolute;z-index:20;left:50%;bottom:15%;transform:translateX(-50%);width:min(720px,88%);background:rgba(5,7,14,.96);border:2px solid #8790aa;padding:18px;display:none;box-shadow:0 10px 40px #000}
#dialogTitle{font-weight:700;margin-bottom:10px}
.choice{display:block;width:100%;margin:8px 0;padding:11px;background:#171d2c;color:#fff;border:1px solid #737c96;font:inherit}
.choice:active{background:#2b344c}
#touch{position:absolute;z-index:10;inset:0;pointer-events:none}
#stick{position:absolute;left:24px;bottom:max(24px,env(safe-area-inset-bottom));width:150px;height:150px;border:2px solid #aab2c8;border-radius:50%;background:rgba(12,17,31,.55);pointer-events:auto}
#knob{position:absolute;width:58px;height:58px;left:46px;top:46px;border-radius:50%;background:#b9c0d2}
#actions{position:absolute;right:24px;bottom:max(24px,env(safe-area-inset-bottom));display:flex;gap:12px;align-items:end;pointer-events:auto}
.round{width:82px;height:82px;border-radius:50%;border:2px solid #aab2c8;background:rgba(12,17,31,.72);color:#fff;font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center}
.round b{font-size:24px}
.round:active{transform:scale(.96);background:#273049}
#phoneBtn{width:74px;height:74px}
#inventoryBtn{width:74px;height:74px}
#start{position:absolute;z-index:30;inset:0;background:linear-gradient(#060811cc,#060811ee);display:flex;align-items:center;justify-content:center;text-align:center}
#startBox{width:min(650px,90%);padding:26px;border:2px solid #737c96;background:#080b15}
#start h1{font-size:clamp(20px,4vw,36px);margin:0 0 12px}
#start p{opacity:.8;line-height:1.5}
#start button{margin-top:12px;padding:13px 24px;background:#202940;color:#fff;border:1px solid #929bb3;font:inherit}
#end{position:absolute;z-index:40;inset:0;display:none;align-items:center;justify-content:center;background:#02030aee;text-align:center}
#endBox{max-width:650px;padding:30px}
@media (orientation:portrait){
  #game{width:100vw;height:100vh}
  #message{bottom:13%}
}
</style>
</head>
<body>
<div id="wrap"><div id="game">
<canvas id="c"></canvas>

<div class="hud">
  <div class="box" id="time">03:17 — Дощ за вікном</div>
  <div class="box" id="goal">Мета: перевірити телефон</div>
</div>

<div id="message"></div>

<div id="dialog">
  <div id="dialogTitle"></div>
  <div id="dialogText"></div>
  <div id="choices"></div>
</div>

<div id="touch">
  <div id="stick"><div id="knob"></div></div>
  <div id="actions">
    <button class="round" id="phoneBtn"><b>▣</b><span>Телефон</span></button>
    <button class="round" id="actBtn"><b>✋</b><span>Дія</span></button>
    <button class="round" id="inventoryBtn"><b>▤</b><span>Інвентар</span></button>
  </div>
</div>

<div id="start">
 <div id="startBox">
  <h1>ДЕХТО ЗАВЖДИ СПОСТЕРІГАЄ...</h1>
  <p>Це вже не картинка — це керована HTML-гра.<br>
  Рухай персонажа джойстиком, підходь до предметів і натискай «Дія».</p>
  <button id="startBtn">ПОЧАТИ</button>
 </div>
</div>

<div id="end"><div id="endBox"></div></div>
</div></div>

const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const game=document.getElementById('game');
const timeEl=document.getElementById('time'),goalEl=document.getElementById('goal');
const msg=document.getElementById('message'),dialog=document.getElementById('dialog');
const titleEl=document.getElementById('dialogTitle'),textEl=document.getElementById('dialogText'),choicesEl=document.getElementById('choices');
const bg=new Image(); bg.src=BG;

let W=0,H=0,scale=1,started=false,last=performance.now();
let player={x:.50,y:.66,speed:.00042,frame:0,dir:1};
let joystick={x:0,y:0,active:false};
let state={phone:false,window:false,door:false,cat:false,watcher:false,ended:false};

function resize(){
  W=canvas.width=innerWidth*devicePixelRatio;
  H=canvas.height=innerHeight*devicePixelRatio;
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  W=innerWidth;H=innerHeight;
}
addEventListener('resize',resize); resize();

function showMessage(t,ms=2200){msg.textContent=t;msg.style.display='block';clearTimeout(showMessage.t);showMessage.t=setTimeout(()=>msg.style.display='none',ms)}
function goal(t){goalEl.textContent='Мета: '+t}
function drawBackground(){
  if(!bg.complete)return;
  const iw=bg.naturalWidth,ih=bg.naturalHeight;
  const r=Math.max(W/iw,H/ih),dw=iw*r,dh=ih*r;
  ctx.drawImage(bg,(W-dw)/2,(H-dh)/2,dw,dh);
  // dark playable-world tint, leaving the original room visible
  ctx.fillStyle='rgba(3,5,12,.14)';ctx.fillRect(0,0,W,H);
}
function worldRect(){
  // approximate room area inside the supplied reference image
  const top=H*.29,bottom=H*.83,left=W*.02,right=W*.98;
  return {top,bottom,left,right};
}
function drawPixelBoy(){
  const r=worldRect();
  const x=r.left+(player.x)*(r.right-r.left);
  const y=r.top+(player.y)*(r.bottom-r.top);
  const s=Math.max(2,Math.min(W,H)/190);
  ctx.save();ctx.translate(x,y);
  ctx.imageSmoothingEnabled=false;
  // shadow
  ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(-10*s,14*s,20*s,5*s);
  // legs
  ctx.fillStyle='#101827';ctx.fillRect(-9*s,0,7*s,17*s);ctx.fillRect(2*s,0,7*s,17*s);
  ctx.fillStyle='#b9b4b1';ctx.fillRect(-10*s,16*s,8*s,3*s);ctx.fillRect(3*s,16*s,8*s,3*s);
  // hoodie
  ctx.fillStyle='#171d2b';ctx.fillRect(-12*s,-25*s,24*s,27*s);
  ctx.fillStyle='#262e40';ctx.fillRect(-15*s,-23*s,5*s,17*s);ctx.fillRect(10*s,-23*s,5*s,17*s);
  // head/hair
  ctx.fillStyle='#b88972';ctx.fillRect(-7*s,-36*s,14*s,12*s);
  ctx.fillStyle='#17141b';ctx.fillRect(-8*s,-39*s,16*s,7*s);ctx.fillRect(-5*s,-43*s,12*s,5*s);
  ctx.fillStyle='#0b0d14';ctx.fillRect(-4*s,-35*s,2*s,2*s);
  ctx.restore();
}
function interactables(){
  const r=worldRect();
  return [
   {id:'cat',name:'Кіт',x:.10,y:.60,rad:.10},
   {id:'laptop',name:'Ноутбук',x:.30,y:.43,rad:.10},
   {id:'window',name:'Вікно',x:.55,y:.25,rad:.12},
   {id:'door',name:'Двері',x:.88,y:.42,rad:.11},
   {id:'phone',name:'Телефон',x:.62,y:.76,rad:.10}
  ];
}
function nearest(){
  let best=null,bd=999;
  for(const o of interactables()){
    const d=Math.hypot(player.x-o.x,player.y-o.y);
    if(d<o.rad && d<bd){best=o;bd=d}
  }
  return best;
}
function act(){
 if(!started||state.ended)return;
 const o=nearest();
 if(!o){showMessage('Підійди ближче до предмета');return}
 if(o.id==='phone'){
   state.phone=true;goal('зробити вибір у повідомленні');openDialog('Невідомий','«Ти зараз один?»',[
    ['Так. Хто ти?','reply1'],['Не відповідаю','reply2']
   ]);return;
 }
 if(o.id==='window'){
   state.window=true;goal('перевірити телефон');showMessage('Вікно зачинене. На склі хтось залишив мокрий слід.');
   return;
 }
 if(o.id==='door'){
   state.door=true;showMessage('За дверима тихо. Надто тихо.');return;
 }
 if(o.id==='cat'){state.cat=true;showMessage('Кіт дивиться не на тебе, а у вікно…');return}
 if(o.id==='laptop'){showMessage('Ноутбук вимкнений. Екран на секунду засвітився сам.');return}
}
function openDialog(t,txt,arr){
 titleEl.textContent=t;textEl.textContent=txt;choicesEl.innerHTML='';
 arr.forEach(([label,id])=>{const b=document.createElement('button');b.className='choice';b.textContent=label;b.onclick=()=>choice(id);choicesEl.appendChild(b)});
 dialog.style.display='block';
}
function closeDialog(){dialog.style.display='none'}
function choice(id){
 closeDialog();
 if(id==='reply1'){showMessage('Невідомий: «Добре. Тоді не підходь до вікна о 03:20.»');goal('дочекатися 03:20')}
 if(id==='reply2'){showMessage('Невідомий: «Я все одно бачу тебе.»');goal('зачинити вікно')}
}
function watcherEvent(){
 if(state.watcher||state.ended)return;
 state.watcher=true;
 // brief watcher silhouette outside the window
 let t=0;
 const timer=setInterval(()=>{t+=50; if(t>2600){clearInterval(timer);return} },50);
 showMessage('...ти щось помітив у вікні.',2600);
 setTimeout(()=>{ 
   // reveal a figure by forcing a short scene overlay
   const old=state.watcher;
   let n=0; const fx=setInterval(()=>{n++;draw();if(n>12){clearInterval(fx);state.watcher=false}},120);
 },400);
}
function draw(){
 ctx.clearRect(0,0,W,H);drawBackground();
 // subtle rain lines
 ctx.strokeStyle='rgba(100,145,205,.18)';ctx.lineWidth=1;
 for(let i=0;i<80;i++){const x=(i*97+performance.now()*.04)%W;const y=(i*53)%H;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-5,y+15);ctx.stroke()}
 if(state.watcher){
   ctx.fillStyle='rgba(2,3,7,.92)';
   ctx.beginPath();ctx.ellipse(W*.57,H*.31,16,28,0,0,Math.PI*2);ctx.fill();
   ctx.fillRect(W*.555,H*.34,30,65);
 }
 drawPixelBoy();
}
function update(dt){
 if(!started||state.ended)return;
 const r=worldRect();
 player.x+=joystick.x*player.speed*dt*1000;
 player.y+=joystick.y*player.speed*dt*1000;
 player.x=Math.max(.03,Math.min(.97,player.x));player.y=Math.max(.20,Math.min(.88,player.y));
 player.frame+=dt*8;
 if(Math.abs(joystick.x)>.05)player.dir=Math.sign(joystick.x);
 // scheduled 03:20 event after ~12 sec of play
 if(performance.now()-startTime>12000&&!state.watcher)watcherEvent();
}
let startTime=0;
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);

function setStick(e){
 const rect=document.getElementById('stick').getBoundingClientRect();
 const cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;
 let dx=e.clientX-cx,dy=e.clientY-cy,max=50,d=Math.hypot(dx,dy);
 if(d>max){dx=dx/d*max;dy=dy/d*max}
 joystick.x=dx/max;joystick.y=dy/max;
 document.getElementById('knob').style.transform=`translate(${dx}px,${dy}px)`;
}
const stick=document.getElementById('stick');
stick.addEventListener('pointerdown',e=>{joystick.active=true;stick.setPointerCapture(e.pointerId);setStick(e)});
stick.addEventListener('pointermove',e=>{if(joystick.active)setStick(e)});
stick.addEventListener('pointerup',()=>{joystick.active=false;joystick.x=joystick.y=0;document.getElementById('knob').style.transform='translate(0,0)'});
stick.addEventListener('pointercancel',()=>{joystick.active=false;joystick.x=joystick.y=0;document.getElementById('knob').style.transform='translate(0,0)'});

document.getElementById('actBtn').onclick=act;
document.getElementById('phoneBtn').onclick=()=>{player.x=.62;player.y=.76;act()};
document.getElementById('inventoryBtn').onclick=()=>showMessage('Інвентар порожній.');
document.getElementById('startBtn').onclick=()=>{started=true;startTime=performance.now();document.getElementById('start').style.display='none';showMessage('03:17. У кімнаті тихо. Надворі дощ.');goal('перевірити телефон')};

addEventListener('keydown',e=>{
 if(e.key==='e'||e.key==='E')act();
 if(e.key==='ArrowLeft'||e.key==='a')joystick.x=-1;
 if(e.key==='ArrowRight'||e.key==='d')joystick.x=1;
 if(e.key==='ArrowUp'||e.key==='w')joystick.y=-1;
 if(e.key==='ArrowDown'||e.key==='s')joystick.y=1;
});
addEventListener('keyup',e=>{
 if(['ArrowLeft','a','ArrowRight','d'].includes(e.key))joystick.x=0;
 if(['ArrowUp','w','ArrowDown','s'].includes(e.key))joystick.y=0;
});
</script>
</body>
