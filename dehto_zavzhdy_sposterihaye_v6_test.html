<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Дехто завжди спостерігає — v6</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03060b;color:#fff;font-family:monospace;touch-action:none}
#game{position:relative;width:100vw;height:100vh;overflow:hidden;background:#111}
#room{position:absolute;inset:0;background:linear-gradient(#071326 0 57%,#211713 57%);image-rendering:pixelated}
#window{position:absolute;left:30%;top:8%;width:42%;height:47%;border:9px solid #101621;background:#08203c;overflow:hidden}
.city{position:absolute;bottom:0;width:100%;height:44%;background:linear-gradient(90deg,#0a1423 0 12%,#17263c 12% 25%,#091321 25% 37%,#18273d 37% 50%,#091321 50% 65%,#17263d 65% 78%,#091321 78%)}
.lights{position:absolute;inset:30% 0 0;background:repeating-linear-gradient(90deg,transparent 0 26px,#efb84b 27px 31px,transparent 32px 59px);opacity:.48}
.rain{position:absolute;inset:0;background:repeating-linear-gradient(104deg,transparent 0 18px,#82cfff3b 19px 21px,transparent 22px 42px)}
#shadow{position:absolute;left:65%;top:28%;width:40px;height:105px;background:#020408;border-radius:50% 50% 8% 8%;opacity:0;z-index:4;transition:.15s}
#shadow:before{content:"";position:absolute;top:27px;left:8px;width:6px;height:5px;background:#e8f7ff;box-shadow:17px 0 #e8f7ff}
#desk{position:absolute;left:0;bottom:18%;width:38%;height:18%;background:#2b1b12;border-top:9px solid #593a25}
#lamp{position:absolute;left:20%;bottom:35%;z-index:2}.stick{height:74px;width:7px;background:#725b40;margin-left:31px}.shade{width:0;height:0;border-left:30px solid transparent;border-right:30px solid transparent;border-bottom:47px solid #e7a947;filter:drop-shadow(0 0 24px #e7a947)}
#bed{position:absolute;right:-3%;bottom:0;width:54%;height:28%;background:linear-gradient(#2b344b,#111827);border-top:11px solid #0a0f18;border-radius:35px 0 0 0}
#door{position:absolute;right:4%;top:24%;width:12%;height:42%;background:#241c1c;border:8px solid #11131b}
#player{position:absolute;left:50%;bottom:22%;width:55px;height:108px;background:#090d15;border-radius:45% 45% 10% 10%;z-index:8;transition:left .08s}
#player:before{content:"";position:absolute;top:3px;left:7px;width:41px;height:48px;background:#1b1520;border-radius:50%}
.obj{position:absolute;z-index:7;display:none}.tag{padding:6px 8px;background:#050914df;border:1px solid #66738d;font-size:11px}
#noteObj{left:24%;bottom:30%}#doorObj{right:9%;top:62%}
#hud{position:absolute;left:10px;top:9px;z-index:20;padding:8px;background:#050914dd;border:1px solid #46536c;font-size:11px}
#goal{position:absolute;right:10px;top:9px;z-index:20;padding:8px;background:#050914dd;border:1px solid #46536c;font-size:11px}
#interact{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:18;display:none;padding:8px 12px;background:#050914e8;border:1px solid #8190aa}
#joy{position:absolute;left:20px;bottom:18px;width:112px;height:112px;border:2px solid #aab5c999;border-radius:50%;background:#10182a99;z-index:25}
#knob{position:absolute;left:36px;top:36px;width:36px;height:36px;border-radius:50%;background:#d4dbea}
.btn{position:absolute;bottom:24px;width:78px;height:78px;border-radius:50%;border:2px solid #aab5c999;background:#10182acc;color:#fff;font:bold 11px monospace;z-index:25}
#action{right:18px}#phone{right:108px}
.panel{display:none;position:absolute;left:50%;top:12%;transform:translateX(-50%);width:min(470px,78vw);padding:18px;background:#0d1525f5;border:2px solid #52617d;border-radius:13px;z-index:40;box-shadow:0 0 55px #000;font-size:15px}
.panel button{padding:9px 12px;margin:8px 5px 0 0;background:#172641;border:1px solid #6c7b97;color:#fff}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:50;transition:opacity .45s}
</style>
</head>
<body>
<div id="game">
<div id="room">
 <div id="window"><div class="city"></div><div class="lights"></div><div class="rain"></div><div id="shadow"></div></div>
 <div id="desk"></div><div id="lamp"><div class="shade"></div><div class="stick"></div></div><div id="bed"></div><div id="door"></div>
 <div id="player"></div>
 <div id="noteObj" class="obj"><span class="tag">! Записка</span></div>
 <div id="doorObj" class="obj"><span class="tag">Двері</span></div>
</div>
<div id="hud">03:17 · СР, 12 ЧЕРВНЯ<br>КІМНАТА 07</div>
<div id="goal">ЦІЛЬ: ПЕРЕВІРИТИ ТЕЛЕФОН</div>
<div id="interact">Натисни «Дія»</div>
<div id="joy"><div id="knob"></div></div>
<button id="phone" class="btn">📱<br>Телефон</button>
<button id="action" class="btn">✋<br>Дія</button>

<div id="phonePanel" class="panel">
<b>Невідомий</b><br><br>
<span id="message">Ти не спиш?</span><br><small>03:17</small><br>
<button onclick="reply('who')">Хто ти?</button>
<button onclick="reply('why')">Що тобі потрібно?</button>
<button onclick="closePanels()">Закрити</button>
</div>

<div id="objectPanel" class="panel"></div>
<div id="fade"></div>
</div>

<script>
const player=document.getElementById('player'), goal=document.getElementById('goal'), interact=document.getElementById('interact');
const noteObj=document.getElementById('noteObj'), doorObj=document.getElementById('doorObj'), shadow=document.getElementById('shadow');
const phonePanel=document.getElementById('phonePanel'), objectPanel=document.getElementById('objectPanel'), fade=document.getElementById('fade');
let x=50, replied=false, noteRead=false, doorChecked=false, storyStarted=false, busy=false;

function move(dx){
 if(busy)return;
 x=Math.max(5,Math.min(91,x+dx));
 player.style.left=x+'%';
 updateNearby();
}
function updateNearby(){
 if(x<35 && !noteRead){interact.style.display='block';interact.textContent='✋ Дія — записка'}
 else if(x>78 && !doorChecked){interact.style.display='block';interact.textContent='✋ Дія — двері'}
 else {interact.style.display='none'}
}
function phone(){
 if(busy)return;
 phonePanel.style.display=phonePanel.style.display==='block'?'none':'block';
}
document.getElementById('phone').onclick=phone;

function action(){
 if(busy)return;
 if(x<35 && !noteRead){
   noteRead=true;
   objectPanel.innerHTML='<b>ЗАПИСКА</b><br><br>«Не відповідай йому після 03:20.»<br><br><button onclick="closePanels()">Зрозуміло</button>';
   objectPanel.style.display='block'; goal.textContent='ЦІЛЬ: ЗАПАМʼЯТАТИ ЗАПИСКУ'; updateNearby(); return;
 }
 if(x>78 && !doorChecked){
   doorChecked=true;
   objectPanel.innerHTML='<b>ДВЕРІ</b><br><br>За дверима чути дуже тихі кроки.<br><br><button onclick="closePanels()">Відійти</button>';
   objectPanel.style.display='block'; goal.textContent='ЦІЛЬ: ПОВЕРНУТИСЯ ДО ТЕЛЕФОНУ'; updateNearby(); return;
 }
 if(replied && !storyStarted){startHorror();}
}
function reply(type){
 replied=true;
 document.getElementById('message').textContent=type==='who'?'Я той, хто дивиться.':'Мені потрібно, щоб ти подивився у вікно.';
 goal.textContent='ЦІЛЬ: ДОЧЕКАТИСЯ 03:20';
 setTimeout(()=>phonePanel.style.display='none',1200);
 setTimeout(startHorror,3000);
}
function closePanels(){phonePanel.style.display='none';objectPanel.style.display='none'}
function startHorror(){
 if(storyStarted)return; storyStarted=true; busy=true; goal.textContent='03:20 — НЕ РУХАТИСЯ';
 fade.style.opacity='.42';
 setTimeout(()=>{fade.style.opacity='.08';shadow.style.opacity='1'},500);
 setTimeout(()=>{shadow.style.left='57%';},1400);
 setTimeout(()=>{shadow.style.opacity='0';},2300);
 setTimeout(()=>{fade.style.opacity='0'; showChoice()},2800);
}
function showChoice(){
 objectPanel.innerHTML='<b>Тиша.</b><br><br>Ти більше не чуєш кроків. Але хтось стоїть за вікном.<br><br>'+
 '<button onclick="ending(1)">Подивитися у вікно</button>'+
 '<button onclick="ending(2)">Перевірити двері</button>'+
 '<button onclick="ending(3)">Знову відкрити телефон</button>';
 objectPanel.style.display='block'; busy=false;
 goal.textContent='ЦІЛЬ: ЗРОБИТИ ВИБІР';
}
function ending(n){
 busy=true; objectPanel.style.display='none'; fade.style.opacity='.9';
 setTimeout(()=>{
  fade.style.opacity='0';
  let t=n===1?'Ти дивишся у вікно.<br><br><b>Він уже стоїть у кімнаті.</b><br><br>КІНЕЦЬ 01':
   n===2?'Ти відчиняєш двері.<br><br>Коридор порожній. На підлозі лежить твій телефон.<br><br>КІНЕЦЬ 02':
   'Телефон вмикається сам.<br><br><b>Невідомий:</b> «Правильний вибір.»<br><br>КІНЕЦЬ 03';
  objectPanel.innerHTML=t+'<br><br><button onclick="location.reload()">Почати спочатку</button>';
  objectPanel.style.display='block'; busy=false;
 },700);
}

// touch joystick
const joy=document.getElementById('joy'),knob=document.getElementById('knob'); let sx=null;
joy.addEventListener('pointerdown',e=>{sx=e.clientX;joy.setPointerCapture(e.pointerId)});
joy.addEventListener('pointermove',e=>{if(sx===null)return;let dx=e.clientX-sx;if(Math.abs(dx)>7){move(dx>0?.8:-.8);knob.style.left=Math.max(8,Math.min(68,36+dx/3))+'px'}});
joy.addEventListener('pointerup',()=>{sx=null;knob.style.left='36px'});
document.addEventListener('pointerup',()=>{sx=null;knob.style.left='36px'});
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')move(-2);if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')move(2);if(e.key.toLowerCase()==='e')action();if(e.key.toLowerCase()==='p')phone()});
updateNearby();
</script>
</body>
</html>
